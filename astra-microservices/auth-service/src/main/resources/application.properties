spring.application.name=auth-service


spring.config.import=configserver:http://localhost:8888



# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.astra.auth.controller

logging.level.org.springframework.security=TRACE

app.auth.base-url=http://localhost:8081
app.internal-api-key=${ASTRA_INTERNAL_API_KEY:U9wyeZRKQYSxcAdhz63CAEq/ifM38QDPSsENIIsdayY=}

# Expired JWT revocation cleanup - every hour
app.security.revoked-token-cleanup-cron=0 0 * * * *


# ==========================================
# ASTRA - DISTRIBUTED TRACING
# ==========================================

# Enable distributed tracing
management.tracing.sampling.probability=1.0

# Jaeger OTLP HTTP exporter
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Disable OTLP metrics export to Jaeger
management.otlp.metrics.export.enabled=false

# Trace ID and Span ID in application logs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

