

# Customer Service
spring.application.name=customer-service
server.port=8082

app.jwt.secret=${JWT_SECRET:AATRDsj5NxySBwZCYGcMlTqqSXFdmFhJnUdaMMGiltM=}

# Central Config Server
spring.config.import=optional:configserver:http://localhost:8888

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/astra_customer_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Distributed Tracing
management.tracing.sampling.probability=1.0

# Zipkin Server
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Application
#spring.application.name=customer-service

# OpenTelemetry Distributed Tracing
#management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Disable OTLP metrics export to Jaeger
management.otlp.metrics.export.enabled=false

# Trace correlation in logs
#logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

# Service information
info.app.name=Astra Customer Service
info.app.version=1.0.0


