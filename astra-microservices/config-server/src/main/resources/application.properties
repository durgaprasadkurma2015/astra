


# Application
spring.application.name=config-server

# Server
server.port=8888

# Native configuration repository
spring.profiles.active=native

spring.cloud.config.server.native.search-locations=file:../config-repo

# Eureka Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# ASTRA - DISTRIBUTED TRACING
# ==========================================

# Enable distributed tracing
management.tracing.sampling.probability=1.0

# Jaeger OTLP HTTP exporter
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Trace ID and Span ID in application logs
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Disable OTLP metrics export to Jaeger
management.otlp.metrics.export.enabled=false
