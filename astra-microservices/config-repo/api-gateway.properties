# ==========================================
# ASTRA API GATEWAY
# ==========================================

server.port=8080

# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================
# SERVICE DISCOVERY
# ==========================================

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ==========================================
# CUSTOMER SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/customers/**

# ==========================================
# PRODUCT SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/products/**

# ==========================================
# PRODUCT ADMIN ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[2].id=product-admin-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/admin/products/**

# ==========================================
# INVENTORY SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/inventory/**

# ==========================================
# AUTH SERVICE ROUTE
# ==========================================

spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/auth/**

# ==========================================
# JWT CONFIGURATION
# ==========================================

app.jwt.secret=${JWT_SECRET:AATRDsj5NxySBwZCYGcMlTqqSXFdmFhJnUdaMMGiltM=}

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway,mappings
management.endpoint.gateway.access=read-only
management.endpoint.health.show-details=always

# JWT Configuration
app.jwt.secret=${JWT_SECRET:AATRDsj5NxySBwZCYGcMlTqqSXFdmFhJnUdaMMGiltM=}
app.jwt.expiration-ms=900000




# ==========================================
# APPLICATION INFORMATION
# ==========================================

info.app.name=Astra API Gateway
info.app.description=Central entry point for Astra microservices
info.app.version=1.0.0
app.message=Configuration loaded from Astra Config Server
app.environment=development



