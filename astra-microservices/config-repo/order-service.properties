app.services.cart-service=http://CART-SERVICE
app.services.product-service=http://PRODUCT-SERVICE
app.services.inventory-service=http://INVENTORY-SERVICE

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
