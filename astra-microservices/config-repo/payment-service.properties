server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3306/astra_payment_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Mysql@123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.jwt.secret=${JWT_SECRET:AATRDsj5NxySBwZCYGcMlTqqSXFdmFhJnUdaMMGiltM=}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=Astra Payment Service
info.app.version=1.0.0

# Payment gateway selection
app.payment.gateway=mock

# Supported values: SUCCESS, FAILED, PENDING
app.payment.mock.default-result=SUCCESS

# Kafka producer reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Payment Outbox
app.outbox.poll-interval-ms=2000
app.outbox.batch-size=50