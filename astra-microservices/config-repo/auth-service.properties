# Server
server.port=8081

logging.level.org.springframework.security=INFO

# Application
spring.application.name=auth-service

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/astra_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Mysql@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Admin Bootstrap Configuration
astra.bootstrap.admin.enabled=true

ASTRA_BOOTSTRAP_ADMIN_EMAIL=admin@astra.local
ASTRA_BOOTSTRAP_ADMIN_PASSWORD=Admin@123456
ASTRA_BOOTSTRAP_ADMIN_FULL_NAME=Astra Administrator

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Email SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:durgaprasadkurma1999@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dzytbhzzziofcxub}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

