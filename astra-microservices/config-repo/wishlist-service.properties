server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/astra_wishlist_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Mysql@123}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT
app.jwt.secret=${JWT_SECRET:AATRDsj5NxySBwZCYGcMlTqqSXFdmFhJnUdaMMGiltM=}

# Product Service
app.services.product-service=http://PRODUCT-SERVICE

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=Astra Wishlist Service
info.app.version=1.0.0