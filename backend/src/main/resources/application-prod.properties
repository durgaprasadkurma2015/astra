
# Production profile
# These values must come from the deployment environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astra_prod?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never let Hibernate create or modify the production schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production frontend and Redis
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# HTTPS-only refresh cookies
app.auth.cookie-secure=true
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Public file URL must point to the deployed HTTPS backend or file host.
app.files.public-base-url=${ASTRA_PUBLIC_BASE_URL}

# Production logging
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Minimal Actuator exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
