spring.application.name=backend

server.port=8080

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astra_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# Security debugging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
#logging.level.org.springframework.security=DEBUG

#debug=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Flyway Database Migrations
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true



# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.auth.refresh-cookie-name=ASTRA_REFRESH
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.security.auth-rate-limit-window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
app.security.login-rate-limit=${AUTH_LOGIN_RATE_LIMIT:10}
app.security.recovery-rate-limit=${AUTH_RECOVERY_RATE_LIMIT:5}

# Password reset email
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ASTRA password reset
app.password-reset.otp-expiration-seconds=300
app.password-reset.token-expiration-seconds=600
app.password-reset.resend-cooldown-seconds=60
app.password-reset.max-attempts=5
app.password-reset.otp-hmac-secret=${OTP_HMAC_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Razorpay Online Payments. Leave empty to disable online checkout.
app.payment.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# Swagger UI display
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# API documentation
springdoc.show-actuator=true



# ==============================
# Connection Pool - HikariCP
# ==============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==============================
# JPA Performance
# ==============================
#spring.jpa.open-in-view=false
#spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==============================
# API Error Details
# ==============================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ==============================
# Graceful Shutdown
# ==============================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

