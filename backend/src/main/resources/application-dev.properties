
# Development profile
spring.jpa.show-sql=true

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Local frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Local development cookie settings
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax

# Development diagnostics
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,threaddump,scheduledtasks,mappings,caches,conditions,configprops,env,beans,httpexchanges,startup
