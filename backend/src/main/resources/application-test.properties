
# Test profile
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/astra_test?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}

# Flyway uses the test datasource
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# Keep schema validation enabled
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Avoid requiring a running Redis instance for ordinary tests
spring.cache.type=none

# Quiet logs during automated tests
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# Do not expose diagnostic endpoints during tests
management.endpoints.web.exposure.include=health,info
