# HTTPS profile. Configure a PKCS12 keystore outside source control.
server.port=${HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:classpath:astra-keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:astra}
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.ciphers=${SSL_CIPHERS:TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256}
