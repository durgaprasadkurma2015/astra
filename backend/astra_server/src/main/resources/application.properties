
# =========================================================
# ASTRA - BASE CONFIGURATION
# =========================================================

spring.application.name=astra_server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# =========================================================
# DATABASE - MYSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astra_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:Mysql@123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

astra.password-reset.expiry-minutes=30

spring.jpa.open-in-view=false

# =========================================================
# CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JSON
# =========================================================

spring.jackson.time-zone=Asia/Kolkata


# =========================================================
# JWT
# =========================================================

astra.security.jwt.secret=${JWT_SECRET:astra-development-jwt-secret-2026-32bytes-minimum}


astra.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}

astra.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =========================================================
# CORS
# =========================================================

astra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Application properties
astra.app.name=${ASTRA_APP_NAME:Astra}
astra.app.environment=${APP_ENVIRONMENT:local}
astra.app.frontend-url=${FRONTEND_URL:http://localhost:5173}





# =========================================================
# ASTRA MEDIA / FILE STORAGE
# =========================================================

astra.media.upload-dir=${ASTRA_MEDIA_UPLOAD_DIR:uploads}

astra.media.max-file-size=${ASTRA_MEDIA_MAX_FILE_SIZE:10485760}

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}

spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Google OAuth client verification
astra.google.client-id=${GOOGLE_CLIENT_ID:}

# Elasticsearch - optional for advanced search
spring.elasticsearch.uris=${ELASTICSEARCH_URI:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}
spring.elasticsearch.connection-timeout=${ELASTICSEARCH_CONNECTION_TIMEOUT:5s}
spring.elasticsearch.socket-timeout=${ELASTICSEARCH_SOCKET_TIMEOUT:30s}
spring.elasticsearch.ssl.ca-certificates=classpath:certs/http_ca.crt

#spring.elasticsearch.uris=https://localhost:9200
#spring.elasticsearch.username=elastic
#spring.elasticsearch.password=CBOtAo3_k7kZxM4WE*kn
#spring.elasticsearch.ssl.ca-certificates=classpath:certs/http_ca.crt

# Redis / cache
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:astra-default}
spring.kafka.consumer.properties.spring.json.trusted.packages=com.astra.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.astra.event.ProductEvent
spring.kafka.producer.properties.spring.json.add.type.headers=false
astra.kafka.product-topic=${KAFKA_PRODUCT_TOPIC:astra.product.events}
astra.kafka.product-group=${KAFKA_PRODUCT_GROUP:astra-search-indexer}

# RabbitMQ
astra.rabbit.enabled=${RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:false}

# Async / scheduling / SSE
spring.task.execution.pool.core-size=${ASTRA_ASYNC_CORE:4}
spring.task.execution.pool.max-size=${ASTRA_ASYNC_MAX:16}
spring.task.execution.pool.queue-capacity=${ASTRA_ASYNC_QUEUE:500}
astra.scheduler.refresh-token-cleanup-cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 * * * *}
astra.metrics.heartbeat-ms=${METRICS_HEARTBEAT_MS:60000}

# Actuator / observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,threaddump
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.info.env.enabled=true

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.astra=${LOG_LEVEL_ASTRA:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.rabbitmq.template.retry.enabled=${RABBITMQ_TEMPLATE_RETRY_ENABLED:true}
spring.rabbitmq.template.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
spring.rabbitmq.template.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
