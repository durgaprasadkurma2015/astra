
# =========================================================
# ASTRA APPLICATION
# =========================================================

spring.application.name=astra_server


# =========================================================
# SERVER
# =========================================================

server.port=8080
server.servlet.context-path=/

# =========================================================
# DATABASE - MYSQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/astra_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=false

# =========================================================
# CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JSON
# =========================================================

spring.jackson.time-zone=Asia/Kolkata

#spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================================
# FILE UPLOAD
# =========================================================

#spring.servlet.multipart.max-file-size=10MB

#spring.servlet.multipart.max-request-size=20MB

# =========================================================
# JWT
# =========================================================

astra.security.jwt.secret=${JWT_SECRET:CHANGE_THIS_DEVELOPMENT_SECRET}

astra.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}

astra.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =========================================================
# CORS
# =========================================================

astra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoint.prometheus.enabled=true

# =========================================================
# LOGGING
# =========================================================

logging.level.root=INFO

logging.level.com.astra=DEBUG

logging.level.org.springframework.security=INFO

# =========================================================
# ASTRA MEDIA / FILE STORAGE
# =========================================================

astra.media.upload-dir=${ASTRA_MEDIA_UPLOAD_DIR:uploads}

astra.media.max-file-size=${ASTRA_MEDIA_MAX_FILE_SIZE:10485760}

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=20MB

# =========================================================
# EMAIL
# =========================================================

spring.mail.host=${MAIL_HOST:}

spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# GOOGLE
# =========================================================

astra.google.client-id=${GOOGLE_CLIENT_ID:}

# =========================================================
# APPLICATION
# =========================================================

astra.app.frontend-url=${FRONTEND_URL:http://localhost:5173}

astra.app.name=Astra

astra.app.environment=${APP_ENVIRONMENT:local}






# =========================================================
# ELASTICSEARCH
# =========================================================

spring.elasticsearch.uris=https://localhost:9200

spring.elasticsearch.username=elastic
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD}

spring.elasticsearch.restclient.ssl.bundle=elasticsearch

spring.ssl.bundle.pem.elasticsearch.truststore.certificate=file:C:/Program Users/elasticsearch/config/certs/http_ca.crt

spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s


