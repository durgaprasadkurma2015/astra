name: Build and verify

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: astra_db
          MYSQL_USER: astra_app
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/astra_db
      DB_USERNAME: astra_app
      DB_PASSWORD: ci-app-password
      JWT_SECRET: Y2ktdGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=
      OTP_HMAC_SECRET: Y2ktdGVzdC1vdHAtc2VjcmV0LW11c3QtYmUtMzItYnl0ZXM=
      MAIL_USERNAME: ci@example.invalid
      MAIL_PASSWORD: ci-only-placeholder
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: backend
